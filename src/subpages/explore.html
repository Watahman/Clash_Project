<!doctype html>
<html lang="en" data-theme="dark" class="workspace-page-loading">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the live tools in the ClashPanel workspace.">
    <link rel="stylesheet" href="../assets/css/workspace-loading.css">
    <script src="../assets/js/shell/workspace-bootstrap.js"></script>
    <title>Explore · ClashPanel</title>
    <link rel="icon" type="image/png" href="../assets/css/pictures/clashtools-logo.png">
    <link rel="stylesheet" href="../assets/css/profile-overlay.css">
    <link rel="stylesheet" href="../assets/css/workspace-system.css">
    <script src="../assets/js/Data/runtime-config.js"></script>
    <script type="module" src="../assets/js/shell/workspace-shell.js?v=20260812-shell-cleanup"></script>
    <script type="module" src="../assets/js/pages/explore.js?v=20260812-explore-cleanup"></script>
    <link rel="stylesheet" href="../assets/css/light-theme.css?v=20260812-redesign">
    <link rel="stylesheet" href="../assets/css/workspace-v2.css?v=20260812-theme-unify">
    <link rel="stylesheet" href="../assets/css/pages/explore.css?v=20260812-explore-cleanup">
</head>
<body class="workspace-app" data-workspace-page="explore">
<main class="workspace-explore" id="main-content">
    <header class="workspace-page-header">
        <p class="page-kicker" data-i18n="nav.explore">Explore</p>
        <h1 data-i18n="explore.title">Find the right tool</h1>
        <p data-i18n="explore.intro">Search ClashPanel tools by what you want to do.</p>
    </header>

    <section class="explore-catalog" aria-labelledby="explore-catalog-title">
        <div class="explore-catalog-heading">
            <div>
                <p class="page-kicker" data-i18n="explore.liveTools">Live tools</p>
                <h2 id="explore-catalog-title" data-i18n="explore.catalogTitle">All tools</h2>
            </div>
            <label class="explore-search" for="explore-search">
                <span class="sr-only" data-i18n="explore.searchLabel">Search tools</span>
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
                <input id="explore-search" type="search" autocomplete="off" data-i18n-placeholder="explore.searchPlaceholder" placeholder="Search tools">
            </label>
        </div>

        <div class="explore-grid" aria-live="polite" aria-label="Live tools" data-i18n-aria-label="explore.liveTools"></div>

        <div class="explore-no-results" id="explore-no-results" hidden>
            <p data-i18n="explore.noResults">No tools match your search.</p>
            <button class="cp-button cp-button--secondary" id="explore-clear-search" type="button" data-i18n="explore.clearSearch">Clear search</button>
        </div>
    </section>
</main>
<div class="profile-placeholder"></div>
</body>
</html>
