<!DOCTYPE html>
<html lang="en" class="workspace-page-loading">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <script src="../assets/js/Data/analytics.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search, sort and manage your saved ClashPanel CWL plans.">
    <link rel="stylesheet" href="../assets/css/workspace-loading.css">
    <script src="../assets/js/shell/workspace-bootstrap.js"></script>
    <title>Saved CWL plans · ClashPanel</title>
    <link rel="stylesheet" href="../assets/css/drafts-css.css">
    <link rel="stylesheet" href="../assets/css/workspace-system.css">
    <link rel="icon" type="image/png" href="../assets/css/pictures/clashtools-logo.png">
    <script src="../assets/js/Data/runtime-config.js"></script>
    <script type="module" src="../assets/js/shell/workspace-shell.js?v=20260812-redesign"></script>
    <script type="module" src="../assets/js/pages/cwl-planner-drafts.js"></script>
    <link rel="stylesheet" href="../assets/css/light-theme.css?v=20260812-redesign">
    <link rel="stylesheet" href="../assets/css/workspace-polish.css">
    <link rel="stylesheet" href="../assets/css/workspace-polish-batch2.css">
    <link rel="stylesheet" href="../assets/css/workspace-v2.css?v=20260812-redesign">
    <link rel="stylesheet" href="../assets/css/cwl-saved-plans.css">
</head>
<body class="workspace-app" data-workspace-page="drafts">
<header>
    <div class="left"><a href="../index.html"><img src="../assets/css/pictures/clashtools-logo.png" alt="Tools for Clash logo"></a></div>
    <nav class="center"><a href="./cwl-planner.html" aria-current="page" data-i18n="nav.cwl">CWL planner</a><a href="./cwl-operation-board.html" data-i18n="nav.operation">Operation board</a><a href="./groups.html" data-i18n="nav.groups">Clan Family</a></nav>
    <div class="right"><button type="button" data-language-control data-i18n="header.language">Language</button><button type="button" data-i18n="profile.settings">Settings</button><button id="profile-btn" type="button"><img class="profile-svg-header" src="../assets/css/pictures/profile.svg" alt=""><span data-i18n="header.user">User</span></button></div>
</header>
<main class="drafts-main saved-plans-page" id="main-content">
    <section class="drafts-shell">
        <div class="drafts-header workspace-page-header-row">
            <div>
                <div class="hero-eyebrow" data-i18n="drafts.eyebrow">CWL drafts</div>
                <h1 data-i18n="drafts.title">Saved war plans</h1>
                <p data-i18n="drafts.subtitle">Open, rename, copy or delete your CWL plans.</p>
            </div>
            <a class="button button-primary" id="drafts-new-plan-link" href="./cwl-planner.html" data-new-plan="true" data-i18n="drafts.new">New plan</a>
        </div>
        <p id="drafts-status" class="drafts-status" role="status" aria-live="polite" data-i18n="drafts.loading">Loading plans...</p>
        <section class="workspace-section-block drafts-table-block" aria-labelledby="drafts-table-title">
            <h2 id="drafts-table-title" class="sr-only" data-i18n="drafts.title">Saved war plans</h2>
            <div class="drafts-controls" role="search" data-i18n-aria-label="drafts.controlsLabel" aria-label="Search and sort saved plans">
                <label class="drafts-search-field"><span data-i18n="drafts.searchLabel">Search plans</span><input id="drafts-search" type="search" autocomplete="off" aria-controls="draft-cwl-container" data-i18n-placeholder="drafts.searchPlaceholder" placeholder="Search by plan name"></label>
                <label class="drafts-sort-field"><span data-i18n="drafts.sortLabel">Sort</span><select id="drafts-sort" aria-controls="draft-cwl-container"><option value="updated-desc" data-i18n="drafts.sortUpdatedDesc">Recently updated</option><option value="updated-asc" data-i18n="drafts.sortUpdatedAsc">Least recently updated</option><option value="name-asc" data-i18n="drafts.sortNameAsc">Name A–Z</option><option value="name-desc" data-i18n="drafts.sortNameDesc">Name Z–A</option></select></label>
                <p id="drafts-filter-status" class="drafts-filter-status" role="status" aria-live="polite" hidden></p>
            </div>
            <div class="workspace-table-wrap">
                <table class="workspace-data-table drafts-table">
                    <thead><tr><th data-i18n="plans.name">Plan</th><th data-i18n="plans.clans">Clans</th><th data-i18n="plans.freeRoster">Free roster</th><th data-i18n="plans.updated">Updated</th><th><span class="sr-only" data-i18n="plans.actions">Actions</span></th></tr></thead>
                    <tbody id="draft-cwl-container" aria-live="polite"></tbody>
                </table>
            </div>
        </section>
    </section>
</main>
<footer></footer>
<dialog class="saved-plan-delete-dialog" id="saved-plan-delete-dialog" aria-labelledby="saved-plan-delete-title" aria-describedby="saved-plan-delete-message">
    <form method="dialog">
        <h2 id="saved-plan-delete-title" data-i18n="drafts.delete">Delete plan</h2>
        <p id="saved-plan-delete-message"></p>
        <div class="saved-plan-dialog-actions">
            <button type="button" class="button button-secondary" data-delete-cancel data-i18n="drafts.cancel">Cancel</button>
            <button type="button" class="button button-danger" data-delete-confirm data-i18n="drafts.delete">Delete</button>
        </div>
    </form>
</dialog>
</body>
</html>
