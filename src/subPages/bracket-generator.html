<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracket Generator · Tools for Clash</title>
    <link rel="stylesheet" href="../assets/css/Main-css.css">
    <link rel="stylesheet" href="../assets/css/profile-overlay.css">
    <link rel="icon" type="image/png" href="../assets/css/pictures/shield_with_hamer_logov2.png">
    <link rel="stylesheet" href="../assets/css/bracket.css">
    <link rel="stylesheet" href="../assets/css/workspace-system.css">
    <script type="module" src="../assets/js/shell/workspace-shell.js"></script>
    <script type="module" src="../assets/js/pages/bracket-generator.js"></script>
</head>
<body class="workspace-app" data-workspace-page="bracket">
<header>
    <div class="left"><a href="../index.html"><img src="../assets/css/pictures/shield_with_hamer_logov2.png" alt="Tools for Clash logo"></a></div>
    <nav class="center"><a href="./cwl-planner.html">CWL planner</a><a href="./cwl-operation-board.html" data-i18n="nav.operation">Operation board</a><a href="./bracket-generator.html" aria-current="page">Bracket generator</a><a href="./groups.html" data-i18n="nav.groups">Groepen</a></nav>
    <div class="right"><button type="button" data-language-control data-i18n="header.language">Taal</button><button type="button">Instellingen</button><button id="profile-btn" type="button"><img class="profile-svg-header" src="../assets/css/pictures/profile.svg" alt=""><span data-i18n="header.user">Gebruiker</span></button></div>
</header>
<main class="bracket-main">
    <section class="bracket-controls">
        <div class="hero-eyebrow" data-i18n="bracket.eyebrow">Tournament tools</div>
        <h1 data-i18n="bracket.title">Bracket generator</h1>
        <label for="bracket-name" data-i18n="bracket.name">Naam</label>
        <input id="bracket-name" type="text" maxlength="60" value="Clash tournament">
        <label for="bracket-participants" data-i18n="bracket.participants">Deelnemers of clans</label>
        <textarea id="bracket-participants" rows="10" data-i18n-placeholder="bracket.participantsPlaceholder" placeholder="Eén deelnemer per regel"></textarea>
        <div class="bracket-actions">
            <button id="bracket-generate-seeded" type="button" class="btn btn-primary" data-i18n="bracket.seeded">Seeded genereren</button>
            <button id="bracket-generate-shuffled" type="button" class="btn btn-secondary" data-i18n="bracket.shuffle">Shuffle</button>
            <button id="bracket-export" type="button" data-i18n="bracket.export">JSON exporteren</button>
            <button id="bracket-import" type="button" data-i18n="bracket.import">JSON importeren</button>
            <button id="bracket-reset" type="button" data-i18n="bracket.reset">Wissen</button>
            <input id="bracket-import-file" class="hidden" type="file" accept="application/json">
        </div>
        <p id="bracket-status" class="bracket-status" role="status" aria-live="polite"></p>
    </section>
    <section id="bracket-board" class="bracket-board" aria-live="polite"></section>
</main>
<div class="profile-placeholder"></div>
</body>
</html>
