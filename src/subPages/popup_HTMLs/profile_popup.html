<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="profile-overlay">
    <div class="po-card" role="dialog" aria-modal="true" aria-label="Profiel">

        <div class="po-topbar">
            <button id="po-close" aria-label="Sluiten">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <span class="po-topbar-label">Profiel</span>
        </div>

        <div class="po-header">
            <div class="po-avatar">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
                    <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
            </div>
            <div class="po-user-info">
                <span id="po-username">User</span>
                <button id="po-code-btn">
                    <span id="po-code">8K47TS</span>
                    <svg id="po-ico-copy" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    <svg id="po-ico-check" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="po-hidden">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="po-tabs">
            <button class="po-tab po-tab-active">Bases</button>
            <button class="po-tab">Friends</button>
            <button class="po-tab">Clans</button>
            <button class="po-tab">Settings</button>
        </div>

        <div class="po-panel">
            <p class="po-empty">No bases</p>
            <button id="po-add">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Add base
            </button>
        </div>

        <div class="po-footer">
            <span class="po-footer-label" id="po-member-since">Lid sinds —</span>
        </div>

    </div>
</div>

<template id="po-base">
    <div class="po-base-item">
        <div class="po-base-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/>
            </svg>
        </div>
        <div class="po-base-text">
            <span class="po-base-name">Name</span>
            <span class="po-base-info">Info</span>
        </div>
        <svg class="po-base-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
        </svg>
    </div>
</template>
</body>
</html>
