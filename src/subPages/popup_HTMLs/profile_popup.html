<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="profile-overlay">
    <div class="po-card" role="dialog" aria-modal="true" aria-label="Profiel">

        <div class="po-topbar">
            <button id="po-close" aria-label="Sluiten">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <span class="po-topbar-label" data-i18n="profile.title">Profiel</span>
        </div>

        <div class="po-header">
            <div class="po-avatar">
                <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
            </div>
            <div class="po-user-info">
                <span id="po-username">User</span>
                <button id="po-code-btn">
                    <span id="po-code">8K47TS</span>
                    <svg id="po-ico-copy" xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    <svg class="po-hidden" id="po-ico-check" xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="po-tabs">
            <button class="po-tab po-tab-active" id="po-tab-bases" data-i18n="profile.bases">Bases</button>
            <button class="po-tab" id="po-tab-friends" data-i18n="profile.friends">Vrienden</button>
            <button class="po-tab" id="po-tab-clans" data-i18n="profile.clans">Clans</button>
            <button class="po-tab" id="po-tab-settings" data-i18n="profile.settings">Instellingen</button>
        </div>

        <div class="po-panel">
            <div class="po-panel-content">
                <p class="po-empty" data-i18n="profile.noBases">Geen bases</p>
            </div>

            <div class="po-settings hidden">
                <button id="po-logout-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span data-i18n="profile.logout">Uitloggen</span>
                </button>
            </div>

            <div id="po-add-container">
                <button id="po-add">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    <span id="po-add-text" data-i18n="profile.addBase">Base toevoegen</span>
                </button>
                <button id="po-friend-requests-btn" class="hidden" data-i18n="profile.requests">Requests</button>
                <button id="po-friend-pending-btn" class="hidden" data-i18n="profile.pending">Pending</button>
            </div>
        </div>

        <div class="po-footer">
            <span class="po-footer-label" id="po-member-since">Lid sinds —</span>
        </div>

    </div>
</div>

<div class="overlay hidden" id="po-add-base">
    <div class="overlay-container" id="po-container-add-base">
        <input id="po-input-base-tag" type="text" placeholder="Tag: #">
        <input id="po-input-base-token" type="text" placeholder="Token: ">
        <br>
        <button id="po-overlay-add-base-button" data-i18n="cwl.confirm">Bevestigen</button>
    </div>
</div>

<div class="overlay hidden" id="po-add-clan">
    <div class="overlay-container" id="po-container-add-clan">
        <input id="po-input-clan-tag" type="text" placeholder="Tag: #">
        <br>
        <button id="po-overlay-add-clan-button" data-i18n="cwl.confirm">Bevestigen</button>
    </div>
</div>

<div class="overlay hidden" id="po-friend-list">
    <div class="overlay-container" id="po-container-friend-list">
        <div class="po-friend-list-header">
            <span id="po-friend-list-title" class="po-friend-list-title" data-i18n="profile.requests">Requests</span>
            <button id="po-friend-list-close" class="po-friend-list-close">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <div id="po-friend-list-content" class="po-friend-list-content">
            <p id="po-empty-friendrequest" class="po-empty" data-i18n="profile.requests">Requests</p>
        </div>
    </div>
</div>

<template id="po-friend-request-template">
    <div class="po-base-item">
        <div class="po-friend-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </div>
        <div class="po-base-text">
            <span class="po-base-name">Username</span>
            <span class="po-base-info">Friend code</span>
        </div>
        <div class="po-friend-actions">
            <button class="po-friend-accept" aria-label="Accepteren">
                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </button>
            <button class="po-friend-reject" aria-label="Weigeren">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
    </div>
</template>

<template id="po-friend-pending-template">
    <div class="po-base-item">
        <div class="po-friend-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </div>
        <div class="po-base-text">
            <span class="po-base-name">Username</span>
            <span class="po-base-info">Friend code</span>
        </div>
        <div class="po-friend-clock" aria-label="Wachten op acceptatie">
            <img data-profile-src="clock.svg" alt="Wachten">
        </div>
    </div>
</template>

<template id="po-base-template">
    <div class="po-base-item po-card-base">
        <div class="po-base-icon">
            <img class="po-base-img" data-profile-src="base_icon.svg" alt="Profiel">
        </div>
        <div class="po-base-text">
            <span class="po-base-name">Name</span>
            <span class="po-base-info">Info</span>
        </div>
        <img class="po-base-chevron" data-profile-src="next.svg" alt="next">
    </div>
</template>

<template id="po-friend-template">
    <div class="po-base-item po-card-friend">
        <div class="po-base-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
        </div>
        <div class="po-base-text">
            <span class="po-base-name">Name</span>
            <span class="po-base-info">Info</span>
        </div>
        <img class="po-base-chevron" data-profile-src="next.svg" alt="next">
    </div>
</template>

<template id="po-groups-item-template">
    <div class="po-base-item po-card-clan">
        <div class="po-base-icon po-shield-icon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l7 3v5c0 5-3.1 8.4-7 10-3.9-1.6-7-5-7-10V6l7-3z"/><path d="M12 7v10"/><path d="M8.5 10.5h7"/></svg></div>
        <div class="po-base-text">
            <span class="po-base-name">Naam</span>
            <span class="po-base-info">code</span>
        </div>
        <span class="groups-role-badge">Lid</span>
    </div>
</template>
</body>
</html>
