<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CWL Drafts · Tools for Clash</title>
    <link rel="stylesheet" href="../assets/css/Main-css.css">
    <link rel="stylesheet" href="../assets/css/drafts-css.css">
    <link rel="stylesheet" href="../assets/css/profile-overlay.css">
    <link rel="icon" type="image/png" href="../assets/css/pictures/shield_with_hamer_logov2.png">
    <script type="module" src="../assets/js/pages/cwl-planner-drafts.js"></script>
</head>
<body>
<header>
    <div class="left"><a href="../index.html"><img src="../assets/css/pictures/shield_with_hamer_logov2.png" alt="Tools for Clash logo"></a></div>
    <nav class="center"><a href="./cwl-planner.html" aria-current="page" data-i18n="nav.cwl">CWL planner</a><a href="./cwl-operation-board.html" data-i18n="nav.operation">Operation board</a><a href="./groups.html" data-i18n="nav.groups">Groepen</a></nav>
    <div class="right"><button type="button" data-language-control data-i18n="header.language">Taal</button><button type="button">Instellingen</button><button id="profile-btn" type="button"><img class="profile-svg-header" src="../assets/css/pictures/profile.svg" alt=""><span data-i18n="header.user">Gebruiker</span></button></div>
</header>
<main class="drafts-main">
    <section class="drafts-shell">
        <div class="drafts-header">
            <div>
                <div class="hero-eyebrow" data-i18n="drafts.eyebrow">CWL drafts</div>
                <h1 data-i18n="drafts.title">Opgeslagen oorlogsplannen</h1>
                <p data-i18n="drafts.subtitle">Open, hernoem, kopieer of verwijder je CWL-plannen.</p>
            </div>
            <a class="btn btn-primary" href="./cwl-planner.html" data-i18n="drafts.openPlanner">Open planner</a>
        </div>
        <p id="drafts-status" class="drafts-status" role="status" aria-live="polite" data-i18n="drafts.loading">Plannen laden...</p>
        <div id="draft-cwl-container" aria-live="polite">
            <a id="add-draft-cwl" href="./cwl-planner.html" data-i18n-aria-label="drafts.new">
                <span aria-hidden="true">+</span>
                <strong data-i18n="drafts.new">Nieuw plan</strong>
            </a>
        </div>
    </section>
</main>
<footer></footer>
<div class="profile-placeholder"></div>
</body>
</html>
