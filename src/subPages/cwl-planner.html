<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CWL Planner · Tools for Clash</title>
    <link rel="stylesheet" href="../assets/css/Main-css.css">
    <link rel="icon" type="image/png" href="../assets/css/pictures/shield_with_hamer_logov2.png">
    <link rel="stylesheet" href="../assets/css/cwlPlanner.css">
    <link rel="stylesheet" href="../assets/css/profile-overlay.css">
    <script type="module" src="../assets/js/pages/cwl-planner.js"></script>
</head>
<body>
<header>
    <div class="left">
        <a href="../index.html">
            <img src="../assets/css/pictures/shield_with_hamer_logov2.png" alt="ToolsforClash_logo">
        </a>
    </div>

    <nav class="center">
        <a href="./cwl-planner.html" aria-current="page" data-i18n="nav.cwl">CWL planner</a>
        <a href="./cwl-operation-board.html" data-i18n="nav.operation">Operation board</a>
        <a href="./groups.html" data-i18n="nav.groups">Groepen</a>
    </nav>

    <div class="right">
        <button type="button" data-language-control data-i18n="header.language">Taal</button>
        <button id="profile-btn">
            <img class="profile-svg-header" src="../assets/css/pictures/profile.svg" alt="profile">
            <span data-i18n="header.user">Gebruiker</span>
        </button>
    </div>
</header>

<main class="cwl-main dashboard-main">
    <section class="cwl-sidebar">
        <article>
            <div class="cwl-toolbar cwl-toolbar-players">
                <div class="cwl-toolbar-title">
                    <span data-i18n="cwl.playersSub">Vrij roster</span>
                    <h3 data-i18n="cwl.playersTitle">Spelers</h3>
                </div>
                <div class="cwl-toolbar-actions">
                    <button id="cwl-add-players-button" data-i18n="cwl.addPlayers">Spelers toevoegen</button>
                    <select id="cwl-player-sorting" aria-label="Sort players" data-i18n-aria-label="cwl.sortPlayers">
                        <option value="townhall" data-i18n="cwl.sortTownhall">Town Hall</option>
                        <option value="name" data-i18n="cwl.sortName">Naam</option>
                    </select>
                    <p id="cwl-total-player-amount">0</p>
                </div>
            </div>
            <div id="cwl-available-players" aria-live="polite"></div>
        </article>
    </section>
    <section class="cwl-board">
        <div class="cwl-toolbar cwl-toolbar-board">
            <div class="cwl-toolbar-title">
                <span data-i18n="cwl.clansSub">Planning board</span>
                <h3 data-i18n="cwl.clansTitle">Clans</h3>
            </div>
            <div class="cwl-toolbar-actions cwl-plan-actions">
                <button id="cwl-add-clan-button" data-i18n="cwl.addClan">Clan toevoegen</button>
                <input type="text" id="cwl-plan-name" data-i18n-placeholder="cwl.planPlaceholder" placeholder="Plan naam..." maxlength="40">
                <select id="cwl-load-plan" aria-label="Load plan" data-i18n-aria-label="cwl.loadPlan"></select>
                <button id="cwl-save-plan-button" data-i18n="cwl.save">Opslaan</button>
            </div>
        </div>
        <article id="cwl-all-clans"></article>
    </section>
</main>

<div class="overlay hidden" id="cwl-overlay-add-players">
    <div class="overlay-container" id="cwl-container-add-players">

        <div class="modal-header-row">
            <span class="modal-title" data-i18n="cwl.addPlayers">Spelers toevoegen</span>
        </div>

        <div class="modal-tabs">
            <button class="modal-tab-btn active" data-tab="tag" data-i18n="cwl.addByTag">Via tag</button>
            <button class="modal-tab-btn" data-tab="accounts" data-i18n="cwl.myAccounts">Mijn accounts</button>
            <button class="modal-tab-btn" data-tab="group" data-i18n="cwl.fromGroup">Uit groep</button>
        </div>

        <!-- Tab 1: by tag -->
        <div class="modal-tab-panel" id="modal-tab-tag">
            <p class="modal-field-label" data-i18n="cwl.tagLabel">Speler- of clantag</p>
            <input id="cwl-input-tag" type="text" placeholder="#TAG...">
            <button id="cwl-overlay-confirm-tag-button" class="primary" data-i18n="cwl.confirm">Bevestigen</button>
        </div>

        <!-- Tab 2: my accounts -->
        <div class="modal-tab-panel hidden" id="modal-tab-accounts">
            <div class="modal-segment">
                <button class="modal-seg-btn active" data-seg="mine" data-i18n="cwl.mine">Eigen</button>
                <button class="modal-seg-btn" data-seg="friends" data-i18n="cwl.friends">Vrienden</button>
            </div>
            <div class="modal-account-list" id="cwl-account-list">
                <p id="modal-account-list-empty" data-i18n="cwl.noAccounts">Geen accounts gekoppeld</p>
            </div>
            <button id="cwl-overlay-add-selected-button" class="modal-btn-add-selected" data-i18n="cwl.addSelected">Geselecteerde toevoegen (0)</button>
        </div>

        <!-- Tab 3: from group -->
        <div class="modal-tab-panel hidden" id="modal-tab-group">
            <p class="modal-field-label" data-i18n="cwl.group">Groep</p>
            <select id="cwl-select-group">
                <option value="" data-i18n="cwl.selectGroup">— selecteer een groep —</option>
            </select>
            <p class="modal-field-label" data-i18n="cwl.pollResults">Pollresultaat</p>
            <select id="cwl-select-group-poll">
                <option value="" data-i18n="cwl.noPollSelected">Geen poll geselecteerd</option>
            </select>
            <div id="cwl-group-linked-clans" class="modal-linked-clans hidden"></div>
            <div id="cwl-group-preview" class="modal-empty-state"><span data-i18n="cwl.previewGroup">Selecteer een groep om leden te bekijken</span></div>
            <div class="modal-group-preview-list hidden" id="cwl-group-preview-list"></div>
            <button id="cwl-overlay-load-group-button" class="primary" data-i18n="cwl.loadGroup">Alles uit groep laden</button>
        </div>

    </div>
</div>

<div class="overlay hidden" id="cwl-overlay-add-clan">
    <div class="overlay-container" id="cwl-container-add-clan">
        <input id="cwl-input-clan-clancode" type="text" placeholder="Clancode: #">
        <select id="cwl-overlay-select-amount-players-in-clan">
            <option value="15">15v15</option>
            <option value="30">30v30</option>
        </select>
        <button id="cwl-overlay-add-clan-button" data-i18n="cwl.confirm">Bevestigen</button>
    </div>
</div>

<div class="profile-placeholder"></div>

<template id="cwl-player-template">
    <article class="cwl-player-article">
        <img class="cwl-player-townhall-foto" src="../assets/css/pictures/townhalls/Town_Hall1.png" alt="townhallFoto">
        <div class="cwl-player-info">
            <p class="cwl-player-name"></p>
            <p class="cwl-player-clan"></p>
            <p class="cwl-player-hashtag"></p>
        </div>
    </article>
</template>

<template id="cwl-clan-template">
    <article class="cwl-clan-article">
        <div class="cwl-clan-info-card">
            <img src="../assets/css/pictures/default-clan-banner.png" alt="clanLogo" class="cwl-clan-logo">
            <p class="cwl-clan-name">Clan name</p>
            <p class="cwl-amount-of-players-in-clan">0/30</p>
            <img class="cwl-delete-clan" src="../assets/css/pictures/bin.svg" alt="deleteButton">
        </div>
        <div class="cwl-clan-player-list"></div>
    </article>
</template>

</body>
</html>
