<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groepen · Tools for Clash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="../assets/css/Main-css.css">
    <link rel="stylesheet" href="../assets/css/profile-overlay.css">
    <link rel="stylesheet" href="../assets/css/groups.css">
    <link rel="icon" type="image/png" href="../assets/css/pictures/shield_with_hamer_logov2.png">
    <script type="module" src="../assets/js/groups.js"></script>
</head>
<body>

<header>
    <div class="left">
        <a href="../index.html">
            <img src="../assets/css/pictures/shield_with_hamer_logov2.png" alt="ToolsforClash_logo">
        </a>
    </div>
    <nav class="center">
        <a href="./cwl-planner.html">CWL planner</a>
        <a href="./bracket-generator.html">Bracket generator</a>
        <a href="./groups.html" aria-current="page">Groepen</a>
    </nav>
    <div class="right">
        <button>Taal</button>
        <button>Instellingen</button>
        <button id="profile-btn">
            <img class="profile-svg-header" src="../assets/css/pictures/profile.svg" alt="profile">
            Gebruiker
        </button>
    </div>
</header>

<main id="groups-main">

    <!-- ── Sidebar: groepen van de user ── -->
    <section id="groups-sidebar">
        <div class="groups-sidebar-header">
            <h3>Jouw groepen</h3>
            <button id="groups-new-btn" class="btn-groups-accent">
                <img src="../assets/css/pictures/add.svg" alt="">
                Nieuw
            </button>
        </div>

        <div id="groups-list">
            <!-- Gevuld via JS -->
            <p class="groups-empty">Geen groepen</p>
        </div>
    </section>

    <!-- ── Collapse toggle ── -->
    <button id="groups-collapse-btn" aria-label="Sidebar inklappen" title="Inklappen">
        <img src="../assets/css/pictures/next.svg" alt="" id="groups-collapse-icon">
    </button>

    <!-- ── Main: groepdetail ── -->
    <section id="groups-detail">

        <!-- Lege state -->
        <div id="groups-detail-empty">
            <p class="groups-empty">Selecteer een groep</p>
        </div>

        <!-- Groep detail (verborgen tot een groep geselecteerd is) -->
        <div id="groups-detail-content" class="hidden">

            <div class="groups-detail-header">
                <div class="groups-detail-logo" id="groups-detail-logo">🛡️</div>
                <div class="groups-detail-info">
                    <span class="groups-detail-name" id="groups-detail-name">Groepsnaam</span>
                    <div class="groups-detail-meta">
                        <span id="groups-detail-count">0 leden</span>
                        <button class="groups-code-pill" id="groups-detail-code" title="Kopieer code">
                            <img src="../assets/css/pictures/checkmark_blank.svg" id="groups-detail-checkmark" class="hidden" alt="">
                            <img src="../assets/css/pictures/copy.svg" id="groups-detail-copy" alt="kopieer">
                            <span id="groups-detail-code-text">------</span>
                        </button>
                        <span class="groups-role-badge" id="groups-detail-role">Lid</span>
                        <span class="groups-since" id="groups-detail-since">sinds —</span>
                    </div>
                </div>
                <div class="groups-header-actions">
                    <!-- Enkel zichtbaar voor (co-)leiders -->
                    <button class="btn-groups-accent groups-leader-only hidden" id="groups-poll-btn">
                        <img src="../assets/css/pictures/add.svg" alt="">
                        Poll
                    </button>
                    <button class="btn-groups-default" id="groups-invite-btn">
                        <img src="../assets/css/pictures/userAdd.svg" alt="">
                        Uitnodigen
                    </button>
                    <div class="groups-action-divider"></div>
                    <!-- Enkel zichtbaar voor (co-)leiders -->
                    <button class="btn-groups-icon groups-leader-only hidden" id="groups-settings-btn" title="Beheren">
                        <img src="../assets/css/pictures/settings.svg" alt="Instellingen">
                    </button>
                    <button class="btn-groups-icon groups-danger" id="groups-leave-btn" title="Groep verlaten">
                        <img src="../assets/css/pictures/leaving-door.svg" alt="Verlaten">
                    </button>
                </div>
            </div>

            <div class="groups-members-panel">
                <div id="groups-member-list">
                    <p class="groups-empty">Geen leden</p>
                </div>
            </div>

        </div>
    </section>

</main>

<div class="overlay hidden" id="groups-overlay-new">
    <div class="overlay-container groups-overlay-tabbed">

        <div class="groups-overlay-tabs">
            <button class="groups-overlay-tab groups-overlay-tab-active" id="groups-tab-create">Aanmaken</button>
            <button class="groups-overlay-tab" id="groups-tab-join">Joinen</button>
        </div>

        <!-- Panel: Aanmaken -->
        <div class="groups-overlay-panel" id="groups-panel-create">

            <!-- Sub-tabs: naam of clan -->
            <div class="groups-create-options">
                <button class="groups-create-option groups-create-option-active" id="groups-create-opt-name">
                    Groepsnaam
                </button>
                <button class="groups-create-option" id="groups-create-opt-clan">
                    Clash of Clans clan
                </button>
            </div>

            <!-- Optie 1: vrije naam -->
            <div id="groups-create-by-name">
                <input id="groups-input-name" type="text" placeholder="Groepsnaam">
            </div>

            <!-- Optie 2: clan # -->
            <div id="groups-create-by-clan" class="hidden">
                <input id="groups-input-clan-tag" type="text" placeholder="Clantag: #ABC123">
                <p class="groups-clan-hint" id="groups-clan-hint"></p>
            </div>

            <button class="btn-groups-accent" id="groups-overlay-create-btn">Aanmaken</button>
        </div>

        <!-- Panel: Joinen -->
        <div class="groups-overlay-panel hidden" id="groups-panel-join">
            <input id="groups-input-join-code" type="text" placeholder="Groepscode: ######">
            <button class="btn-groups-accent" id="groups-overlay-join-btn">Joinen</button>
        </div>

    </div>
</div>

<div class="profile-placeholder"></div>

<!-- ── Templates ── -->
<template id="groups-item-template">
    <div class="groups-item">
        <div class="groups-item-logo">🛡️</div>
        <div class="groups-item-info">
            <span class="groups-item-name">Naam</span>
            <span class="groups-item-meta">0 leden</span>
        </div>
        <span class="groups-role-badge">Lid</span>
    </div>
</template>

<template id="groups-member-template">
    <div class="groups-member-item">
        <div class="groups-member-avatar">
            <img src="../assets/css/pictures/profile.svg" alt="">
        </div>
        <span class="groups-member-name">Username</span>
        <span class="groups-member-clan">Clan</span>
        <span class="groups-role-badge">Lid</span>
    </div>
</template>

<!-- ── Leave group confirmation popup ── -->
<div class="overlay hidden" id="groups-overlay-leave">
    <div class="overlay-container groups-overlay-leave-container">
        <h3 class="groups-leave-title">Groep verlaten?</h3>
        <p class="groups-leave-desc">
            Ben je zeker dat je <strong id="groups-leave-name"></strong> wilt verlaten?
            Je kan opnieuw joinen met de groepscode.
        </p>
        <div class="groups-leave-actions">
            <button class="btn-groups-default" id="groups-leave-cancel-btn">Annuleren</button>
            <button class="btn-groups-icon btn-groups-danger groups-leave-confirm-btn" id="groups-leave-confirm-btn">
                <img src="../assets/css/pictures/leaving-door.svg" alt="">
                Verlaten
            </button>
        </div>
    </div>
</div>

</body>
</html>
