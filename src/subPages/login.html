<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen · Tools for Clash</title>
    <link rel="stylesheet" href="../assets/css/Main-css.css">
    <link rel="stylesheet" href="../assets/css/login-css.css">
    <link rel="icon" type="image/png" href="../assets/css/pictures/shield_with_hamer_logov2.png">
    <script type="module" src="../assets/js/pages/login.js"></script>
</head>
<body>
<header>
    <div class="left"><a href="../index.html"><img src="../assets/css/pictures/shield_with_hamer_logov2.png" alt="Tools for Clash logo"></a></div>
    <nav class="center"><a href="cwl-planner.html">CWL planner</a><a href="groups.html">Groepen</a></nav>
    <div class="right"><button type="button">Taal</button></div>
</header>

<main class="auth-main">
    <div class="auth-shell">
        <aside class="auth-brand-panel">
            <div>
                <div class="hero-eyebrow">Secure clan access</div>
                <h2>Back to the war room.</h2>
                <p>Log in om je CWL-plannen, groepen, accounts en vrienden opnieuw te laden.</p>
            </div>
            <div class="auth-mini-grid">
                <div class="auth-mini-card"><strong>CWL</strong><span>Saved rosters</span></div>
                <div class="auth-mini-card"><strong>Groups</strong><span>Clan network</span></div>
            </div>
        </aside>

        <div class="card">
            <div class="card-head">
                <img class="card-logo" src="../assets/css/pictures/shield_with_hamer_logov2.png" alt="logo">
                <h1>Welkom terug</h1>
                <p>Nog geen account? <a href="register.html">Registreren</a></p>
            </div>
            <form class="form" onsubmit="return false;">
                <div class="field"><label for="email">E-mailadres</label><input type="email" id="email" placeholder="jij@voorbeeld.com" autocomplete="email"></div>
                <div class="field"><div class="field-row"><label for="password">Wachtwoord</label><a href="#">Vergeten?</a></div><input type="password" id="password" placeholder="••••••••" autocomplete="current-password"></div>
                <button id="submit-button" class="btn-submit" type="submit">Inloggen</button>
                <div class="or-divider"><hr><span>of</span><hr></div>
                <button class="btn-google" type="button">Doorgaan met Google</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
