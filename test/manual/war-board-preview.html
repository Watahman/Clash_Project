<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAR board manual preview</title>
    <link rel="stylesheet" href="../../src/assets/css/workspace-system.css">
    <link rel="stylesheet" href="../../src/assets/css/war-operation-board.css">
    <style>
        body { margin: 0; background: #0b0d10; font-family: Inter, system-ui, sans-serif; }
        .war-board { padding-top: 24px; }
    </style>
</head>
<body>
<main class="war-board">
    <header class="war-board-header">
        <div><p class="page-kicker">Regular Clan War</p><h1>Clan War Operation Board</h1><p>Manual visual test fixture — never part of the production build.</p></div>
    </header>
    <section class="war-board-content">
        <div class="war-score-strip" id="war-score-strip"></div>
        <nav class="war-tabs"><button type="button" aria-selected="true">Live</button><button type="button">War Map</button><button type="button">Roster</button><button type="button">History</button></nav>
        <div class="war-status-line">Live war data synced from the official Clash of Clans API.</div>
        <div class="war-live-grid">
            <article class="war-primary-panel">
                <header class="war-panel-heading"><div><p class="page-kicker">Battlefield</p><h2>Base map</h2></div></header>
                <div class="war-map" id="war-live-map"></div>
            </article>
            <aside class="war-detail-panel" id="war-base-detail"></aside>
        </div>
        <section class="war-stats-grid" id="war-stats-grid"></section>
    </section>
</main>
<script type="module">
    import { buildWarBoardReport } from '../../src/assets/js/war-operation-board/war-report-model.js';
    import { renderBaseDetail, renderScoreStrip, renderStats, renderWarMap } from '../../src/assets/js/war-operation-board/war-renderer.js';
    const members = (prefix, clanTag) => Array.from({ length: 10 }, (_, index) => ({
        tag: `#${clanTag}${index}`,
        name: `${prefix} ${index + 1}`,
        townhallLevel: index < 3 ? 17 : index < 7 ? 16 : 15,
        mapPosition: index + 1,
        attacks: []
    }));
    const own = members('Vanguard', 'P');
    const enemy = members('Citadel', 'E');
    own[0].attacks = [{ attackerTag: own[0].tag, defenderTag: enemy[0].tag, stars: 2, destructionPercentage: 86, order: 1 }];
    own[1].attacks = [{ attackerTag: own[1].tag, defenderTag: enemy[0].tag, stars: 3, destructionPercentage: 100, order: 3 }];
    own[2].attacks = [{ attackerTag: own[2].tag, defenderTag: enemy[2].tag, stars: 2, destructionPercentage: 79, order: 5 }];
    enemy[0].attacks = [{ attackerTag: enemy[0].tag, defenderTag: own[0].tag, stars: 2, destructionPercentage: 81, order: 2 }];
    enemy[1].attacks = [{ attackerTag: enemy[1].tag, defenderTag: own[1].tag, stars: 3, destructionPercentage: 100, order: 4 }];
    const raw = {
        state: 'inWar', teamSize: 10, attacksPerMember: 2,
        startTime: '20260729T120000.000Z', endTime: '20260730T120000.000Z',
        clan: { tag: '#AAA', name: 'Northwatch', stars: 5, destructionPercentage: 26.5, attacks: 3, members: own },
        opponent: { tag: '#BBB', name: 'Iron Keep', stars: 5, destructionPercentage: 18.1, attacks: 2, members: enemy }
    };
    const report = buildWarBoardReport(raw, '#AAA');
    const assignments = [{ id: 'preview', playerTag: own[3].tag, attackSlot: 1, type: 'base', targetPosition: 2 }];
    renderScoreStrip(document.querySelector('#war-score-strip'), report);
    renderWarMap(document.querySelector('#war-live-map'), report, 'enemy', 2, assignments);
    renderBaseDetail(document.querySelector('#war-base-detail'), report, 'enemy', 2, assignments);
    renderStats(document.querySelector('#war-stats-grid'), report);
</script>
</body>
</html>
