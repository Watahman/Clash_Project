# Copy this file to cloudrun-env.yaml before deploying.
# cloudrun-env.yaml is gitignored. Never put secrets in this file.

# Required backend URLs / production browser origin
_BASE_URL_SUPABASE: "https://<your-project-ref>.supabase.co"
# Publishable key and PostHog project key are ordinary env vars. Replace these
# placeholders only in the ignored cloudrun-env.yaml used for deployment.
_API_KEY_SUPABASE: "sb_publishable_replace_me"
_ALLOWED_ORIGINS: "https://clashpanel.com,https://www.clashpanel.com"
TRUST_PROXY_HEADERS: "true"

# Production auth redirects
AUTH_COOKIE_SECURE: "true"
AUTH_COOKIE_SAME_SITE: "Lax"
AUTH_EMAIL_CONFIRM_REDIRECT_URL: "https://clashpanel.com/subpages/login.html"
AUTH_PASSWORD_RESET_REDIRECT_URL: "https://clashpanel.com/subpages/login.html"
AUTH_GOOGLE_CALLBACK_URL: "https://clashpanel.com/api/AuthGoogleCallback"

# Advanced Stats runtime.
# Keep collection off while Advanced Stats is Coming Soon and its scheduler is paused.
# Re-enabling it requires a separate, explicit release decision.
ADVANCED_STATS_COLLECTION_ENABLED: "false"
ADVANCED_STATS_PUBLIC_ENROLLMENT_ENABLED: "false"
ADVANCED_STATS_ROLLOUT_USER_IDS: ""

# Collector defaults. ClashKing V2 history routes allow up to 500 normal/war
# rows per request; ranked is capped to 200 by the adapter.
ADVANCED_STATS_BATCH_SIZE: "25"
ADVANCED_STATS_PAGE_SIZE: "500"
ADVANCED_STATS_MAX_BOOTSTRAP_PAGES: "20"
ADVANCED_STATS_LEASE_SECONDS: "600"
ADVANCED_STATS_ACTIVE_POLL_MINUTES: "15"
ADVANCED_STATS_IDLE_POLL_MINUTES: "30"
ADVANCED_STATS_RATE_LIMIT_BACKOFF_MINUTES: "30"
ADVANCED_STATS_OUTAGE_BACKOFF_MINUTES: "10"
ADVANCED_STATS_UNKNOWN_BACKOFF_MINUTES: "15"
ADVANCED_STATS_MAX_BACKOFF_MINUTES: "240"
ADVANCED_STATS_DEGRADED_THRESHOLD: "3"

# PostHog product analytics. Development and Production may share one project;
# environment=development|production keeps their events separable in PostHog.
POSTHOG_ENABLED: "true"
POSTHOG_HOST: "https://eu.i.posthog.com"
POSTHOG_PROJECT_API_KEY: "replace_with_posthog_project_api_key"
CLASHPANEL_ENVIRONMENT: "production"
# Populate with the internal ClashPanel profile ID(s) used for testing.
POSTHOG_INTERNAL_USER_IDS: ""

# ClashKing V2 historical source.
CLASHKING_BASE_URL: "https://api.clashk.ing"
# Optional Unix-seconds override. Leave blank to resolve the active ranked
# season automatically from ClashKing V2 /v2/dates/current.
CLASHKING_RANKED_SEASON: ""

# Secrets are intentionally NOT stored here. Configure these through the
# --update-secrets bindings in the deploy/configure scripts:
# SUPABASE_SERVICE_ROLE_KEY
# API_PROXY_SECRET
# ADVANCED_STATS_SCHEDULER_SECRET
# Preview reuses the same ADVANCED_STATS_SCHEDULER_SECRET binding as production.
